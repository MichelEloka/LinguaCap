quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
quarkus.http.limits.max-body-size=1M
quarkus.jackson.fail-on-unknown-properties=true
lingua.cloud-run=${LINGUACAP_CLOUD_RUN:false}
lingua.internal-secret=${LINGUACAP_INTERNAL_SECRET:}
lingua.services.identity=${IDENTITY_URL:http://127.0.0.1:8081}
lingua.services.media=${MEDIA_URL:http://127.0.0.1:8083}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_JDBC_URL}
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=3
quarkus.datasource.jdbc.acquisition-timeout=4S
