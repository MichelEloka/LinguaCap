# Journaux corrélés de tous les services : l'identifiant de requête (X-Request-Id) figure sur chaque ligne.
# Les traces d'exception restent en texte : Cloud Error Reporting les regroupe à partir des journaux Cloud Run.
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%X{requestId}) %s%e%n
quarkus.log.category."org.linguacap.requests".level=INFO
